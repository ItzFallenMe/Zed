name: Release Zed APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify signing secrets
        env:
          KEYSTORE: ${{ secrets.ZED_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ZED_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZED_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZED_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in repository secrets"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "A release APK must be signed. Add the four ZED_RELEASE_* secrets."
            exit 1
          fi

      - name: Materialize keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ZED_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zed-release.jks"
          test -s "$RUNNER_TEMP/zed-release.jks"

      - name: Test, lint, and build signed release
        env:
          ZED_RELEASE_STORE_FILE: ${{ runner.temp }}/zed-release.jks
          ZED_RELEASE_STORE_PASSWORD: ${{ secrets.ZED_RELEASE_STORE_PASSWORD }}
          ZED_RELEASE_KEY_ALIAS: ${{ secrets.ZED_RELEASE_KEY_ALIAS }}
          ZED_RELEASE_KEY_PASSWORD: ${{ secrets.ZED_RELEASE_KEY_PASSWORD }}
          ZED_SIGNING_CERT_SHA256: ${{ secrets.ZED_SIGNING_CERT_SHA256 }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease \
            -PzedAbiSplits=true --no-daemon

      - name: Prepare ARMv8 and universal APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            "dist/Zed-${GITHUB_REF_NAME}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk \
            "dist/Zed-${GITHUB_REF_NAME}-universal.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: zed-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Z.E.D. ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi

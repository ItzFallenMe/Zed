name: Build Zed APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build signed release APK
        env:
          ZED_VERSION_CODE: ${{ github.run_number }}
          ZED_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
          ZED_STORE_PASSWORD: ${{ secrets.ZED_STORE_PASSWORD }}
          ZED_KEY_ALIAS: ${{ secrets.ZED_KEY_ALIAS }}
          ZED_KEY_PASSWORD: ${{ secrets.ZED_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/zed-debug.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/zed-release.apk
          ls -lh artifacts

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zed-debug-apk
          path: artifacts/zed-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: zed-release-apk
          path: artifacts/zed-release.apk
          retention-days: 90

      - name: Verify APK is signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs artifacts/zed-release.apk

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: zed-release-apk
          path: out

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Zed ${{ github.ref_name }}
          files: out/zed-release.apk
          generate_release_notes: true
          body: |
            Zed ${{ github.ref_name }} — signed release APK built by GitHub Actions.

            **Install:** download `zed-release.apk`, allow installs from unknown sources, then open the app and grant the capabilities you want.

            Wake phrase: **"Bolo Zed"** (configurable).

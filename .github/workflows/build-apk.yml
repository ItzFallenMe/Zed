name: Build and Release Zed APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and debug lint
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon

      - name: Build debug APK
        if: github.event_name != 'pull_request'
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Determine whether this commit needs a release
        id: release
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; bump versionName to publish a new release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "A new release will be published as $TAG."
          fi

      - name: Validate release signing secrets
        if: steps.release.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ZED_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZED_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZED_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZED_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing release signing secret: $name"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/zed-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zed-signing/release.jks"
          test -s "$RUNNER_TEMP/zed-signing/release.jks"
          echo "ZED_RELEASE_STORE_FILE=$RUNNER_TEMP/zed-signing/release.jks" >> "$GITHUB_ENV"
          echo "ZED_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ZED_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ZED_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.release.outputs.publish == 'true'
        run: ./gradlew :app:lintRelease :app:assembleRelease --no-daemon

      - name: Create version tag
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Zed $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Prepare APK and checksum
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::Signed APK was not produced"; exit 1; }
          mkdir -p release
          cp "$APK" "release/Zed-$RELEASE_TAG.apk"
          cd release
          sha256sum "Zed-$RELEASE_TAG.apk" > "Zed-$RELEASE_TAG.apk.sha256"

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Zed ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/Zed-${{ steps.release.outputs.tag }}.apk
            release/Zed-${{ steps.release.outputs.tag }}.apk.sha256

      - name: Upload debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: zed-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zed-lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 7

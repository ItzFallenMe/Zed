name: Build Zed APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_DIR" ]; then SDK_DIR="/usr/local/lib/android/sdk"; fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "Using SDK at $SDK_DIR"
          ls "$SDK_DIR"

      - name: Install SDK platform and build tools
        run: |
          SDK_DIR="$ANDROID_HOME"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager | sort | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          if [ ! -d "$SDK_DIR/platforms/android-36" ]; then
            yes | "$SDKMANAGER" "platforms;android-36" || true
          fi
          if [ ! -d "$SDK_DIR/build-tools/36.0.0" ]; then
            yes | "$SDKMANAGER" "build-tools;36.0.0" || true
          fi
          ls "$SDK_DIR/platforms"
          test -d "$SDK_DIR/platforms/android-36" || { echo "android-36 platform missing"; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build signed release APK
        env:
          ZED_VERSION_CODE: ${{ github.run_number }}
          ZED_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.1.1' }}
          ZED_STORE_PASSWORD: ${{ secrets.ZED_STORE_PASSWORD }}
          ZED_KEY_ALIAS: ${{ secrets.ZED_KEY_ALIAS }}
          ZED_KEY_PASSWORD: ${{ secrets.ZED_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/zed-debug.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/zed-release.apk
          ls -lh artifacts

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zed-debug-apk
          path: artifacts/zed-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: zed-release-apk
          path: artifacts/zed-release.apk
          retention-days: 90

      - name: Verify APK is signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs artifacts/zed-release.apk

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: zed-release-apk
          path: out

      - name: Prepare release notes
        run: |
          SHA=$(sha256sum out/zed-release.apk | cut -d' ' -f1)
          cat > notes.md <<EOF
          Zed ${{ github.ref_name }} — signed release APK built by GitHub Actions.

          **Install:** download \`zed-release.apk\`. If Play Protect warns, see
          [INSTALL.md](https://github.com/ItzFallenMe/Zed/blob/main/INSTALL.md) — tap
          *More details → Install anyway*.

          **First run:** Zed asks for a free Gemini key and a free Groq key, then for the
          capabilities you want to grant.

          Wake word: **"Zed"** (configurable).

          SHA-256: \`$SHA\`
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Zed ${{ github.ref_name }}
          files: out/zed-release.apk
          generate_release_notes: true
          body_path: notes.md
